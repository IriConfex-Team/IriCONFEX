name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24 + caché de npm
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate --workspace=api
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Compilar shared
        run: npm run build --workspace=shared

      - name: 1 · ESLint
        run: npm run lint

      - name: 2 · Type check
        run: npm run typecheck

      - name: 3 · Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: 4 · Build
        run: npm run build

      - name: 5 · La API carga con node
        run: node --input-type=module -e "await import('./api/dist/src/app.js')"
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -f api/Dockerfile -t iriconfex-api .
