name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24 + caché de npm
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate --workspace=api
        env:
          # prisma.config.ts exige DIRECT_URL al cargarse, aunque generate no se conecta a ninguna base
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Compilar shared
        run: npm run build --workspace=shared

      - name: 1 · ESLint
        run: npm run lint

      - name: 2 · Type check
        run: npm run typecheck

      - name: 3 · Tests
        run: npm test

      - name: 4 · Build
        run: npm run build